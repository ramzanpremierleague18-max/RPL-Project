<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RPL Admin</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#070f17;
  --panel:#0e1622;
  --accent:#f5c451;
  --ok:#3ddc97;
  --err:#ff5c5c;
  --text:#eef3f7;
  --muted:#9aa8b2;
}

*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,system-ui,Arial;
  background:radial-gradient(circle at top,#0b1c2e,#040a11);
  color:var(--text);
  min-height:100vh;
}

.wrap{max-width:1200px;margin:30px auto;padding:18px}

header{display:flex;justify-content:space-between;align-items:center}
h1{margin:0;font-weight:800}

.controls{display:flex;gap:10px}

.btn{
  background:linear-gradient(135deg,var(--accent),#ffd97a);
  color:#1a1200;
  padding:9px 14px;
  border-radius:12px;
  border:0;
  font-weight:800;
  cursor:pointer;
  transition:.25s;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(245,196,81,.45)}

.ghost{
  background:transparent;
  border:1px solid rgba(255,255,255,.08);
  color:var(--muted);
  padding:9px 14px;
  border-radius:12px;
  cursor:pointer;
  transition:.25s;
}
.ghost:hover{background:rgba(255,255,255,.05)}

.card{
  margin-top:20px;
  background:linear-gradient(180deg,var(--panel),rgba(255,255,255,.02));
  border-radius:18px;
  padding:16px;
}

table{width:100%;border-collapse:collapse}
th,td{padding:10px;font-size:14px;border-bottom:1px solid rgba(255,255,255,.04)}
th{color:var(--muted)}

.thumb{
  width:80px;
  height:56px;
  object-fit:cover;
  border-radius:8px;
  cursor:pointer;
  transition:.25s;
}
.thumb:hover{transform:scale(1.06)}

.actions{display:flex;gap:8px}

/* STATUS */
.pending{color:#f7b731}
.verified{color:var(--ok);font-weight:700}
.rejected{color:var(--err);font-weight:700}

/* MODALS */
.modal{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.75);
  z-index:999;
}
.hidden{display:none}

.image-box{
  background:#050b12;
  padding:14px;
  border-radius:18px;
  animation:zoomIn .35s ease;
}
.image-box img{
  max-width:90vw;
  max-height:80vh;
  border-radius:14px;
}

/* TOAST */
.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  background:linear-gradient(135deg,var(--ok),#6bf5b3);
  color:#042a18;
  padding:14px 18px;
  border-radius:14px;
  font-weight:800;
  box-shadow:0 12px 40px rgba(61,220,151,.45);
  animation:slideIn .45s ease;
}

/* ANIMATIONS */
@keyframes zoomIn{
  from{transform:scale(.85);opacity:0}
  to{transform:scale(1);opacity:1}
}
@keyframes slideIn{
  from{transform:translateX(60px);opacity:0}
  to{transform:translateX(0);opacity:1}
}
</style>
</head>

<body>

<div class="wrap">
<header>
<div>
<h1>RPL — Admin Dashboard</h1>
<div style="color:var(--muted);font-size:13px">Designed & Developed by Noor Ali</div>
</div>
<div class="controls">
<button id="exportExcel" class="ghost">⬇ Excel</button>
<button id="loginBtn" class="btn">Login</button>
<button id="refresh" class="ghost">Refresh</button>
</div>
</header>

<div class="card">
<table id="listTable">
<thead>
<tr>
<th>ID</th><th>Name</th><th>Mobile</th><th>Email</th>
<th>Role</th><th>Photo</th><th>Payment</th><th>Status</th><th>Actions</th>
</tr>
</thead>
<tbody></tbody>
</table>
</div>
</div>

<!-- LOGIN -->
<div id="loginModal" class="modal hidden">
<div class="image-box">
<h3>Admin Login</h3>
<input id="admUser" placeholder="Username"><br><br>
<input id="admPass" type="password" placeholder="Password"><br><br>
<button id="doLogin" class="btn">Login</button>
<button id="cancelLogin" class="ghost">Cancel</button>
</div>
</div>

<!-- IMAGE VIEW -->
<div id="imageModal" class="modal hidden">
<div class="image-box">
<img id="popupImg">
</div>
</div>

<div id="toast" class="toast hidden"></div>

<script>
const el=id=>document.getElementById(id);
let regs=[];

/* TOAST */
function toast(msg){
  const t=el('toast');
  t.textContent=msg;
  t.classList.remove('hidden');
  setTimeout(()=>t.classList.add('hidden'),2500);
}

/* IMAGE VIEW */
function openImage(src){
  el('popupImg').src=src;
  el('imageModal').classList.remove('hidden');
}
el('imageModal').onclick=()=>el('imageModal').classList.add('hidden');

/* LOGIN */
loginBtn.onclick=()=>loginModal.classList.remove('hidden');
cancelLogin.onclick=()=>loginModal.classList.add('hidden');

doLogin.onclick=async()=>{
  const r=await fetch('/admin/login',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    credentials:'include',
    body:JSON.stringify({user:admUser.value,pass:admPass.value})
  });
  const d=await r.json();
  if(d.ok){loginModal.classList.add('hidden');load();}
  else toast('Login failed');
};

/* LOAD DATA */
async function load(){
  const r=await fetch('/registrations',{credentials:'include'});
  if(r.status===401)return toast('Login required');
  regs=await r.json();
  render();
}

/* RENDER */
function render(){
  const tb=listTable.querySelector('tbody');
  tb.innerHTML='';
  regs.forEach(r=>{
    tb.innerHTML+=`
<tr>
<td>${r.id}</td>
<td>${r.playerName}</td>
<td>${r.playerMobile}</td>
<td>${r.playerEmail}</td>
<td>${r.playerRole}</td>
<td><img class="thumb preview" data-img="${r.passport_photo}" src="${r.passport_photo}"></td>
<td><img class="thumb preview" data-img="${r.payment_screenshot}" src="${r.payment_screenshot}"></td>
<td class="${r.payment_status}">${r.payment_status}</td>
<td class="actions">
<button class="btn" onclick="verify(${r.id})">Verify</button>
<button class="ghost" onclick="act('/admin/reject/${r.id}')">Reject</button>
<button class="ghost" onclick="act('/admin/delete/${r.id}')">Delete</button>
</td>
</tr>`;
  });
}

/* IMAGE CLICK HANDLER (SAFE) */
document.addEventListener('click',e=>{
  const img=e.target.closest('.preview');
  if(img) openImage(img.dataset.img);
});

/* ACTIONS */
async function verify(id){
  await fetch('/admin/verify/'+id,{method:'POST',credentials:'include'});
  toast('Player verified');
  load();
}
async function act(url){
  await fetch(url,{method:'POST',credentials:'include'});
  load();
}

exportExcel.onclick=()=>location.href='/admin/export';
refresh.onclick=load;

/* AUTO LOAD */
fetch('/admin/status',{credentials:'include'})
.then(r=>r.json()).then(d=>{if(d.loggedIn)load();});
</script>

</body>
</html>
