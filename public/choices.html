<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>RPL — Choose</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#10061a;
  --panel:#1b0622;
  --accentA:#ff4b6e;
  --accentB:#ffd36b;
  --gold:#d4af37;
  --white:#fff;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family:Montserrat,system-ui;
  background:
    radial-gradient(circle at 20% 20%, #2b0038 0%, var(--bg) 40%),
    linear-gradient(180deg,#0b0410,#14061b);
  color:var(--white);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.top-right{
  position:fixed;
  top:14px;
  right:16px;
  font-weight:700;
  color:var(--gold);
  z-index:50;
}

.wrap{
  width:100%;
  max-width:980px;
  padding:28px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.box{
  width:100%;
  border-radius:18px;
  padding:36px;
  background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
  box-shadow:0 30px 80px rgba(0,0,0,.6);
  text-align:center;
  transition:transform .6s ease, opacity .4s ease;
}

h2{margin:0;font-size:28px}

.options{
  display:flex;
  gap:18px;
  margin-top:22px;
  justify-content:center;
  flex-wrap:wrap;
}

.big-btn{
  min-width:220px;
  padding:18px 24px;
  border-radius:14px;
  border:0;
  font-size:18px;
  font-weight:900;
  cursor:pointer;
  background:linear-gradient(90deg,var(--accentA),var(--accentB));
  color:#0a0310;
  box-shadow:0 20px 50px rgba(255,80,120,0.12);
  transition:.35s;
}

.big-btn:hover{
  transform:translateY(-4px) scale(1.03);
  box-shadow:0 30px 70px rgba(255,80,120,.35);
}

.ghost{
  background:transparent;
  border:1px solid rgba(255,255,255,0.08);
  color:rgba(255,255,255,0.95);
  font-weight:700;
}

.swirl{
  position:absolute;
  inset:0;
  pointer-events:none;
  mix-blend-mode:screen;
  opacity:.12;
}

/* ===== LOGIN MODAL ===== */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:100;
}

.hidden{display:none}

.login-box{
  background:linear-gradient(180deg,#160820,#0e0414);
  padding:28px;
  border-radius:18px;
  width:320px;
  box-shadow:0 25px 80px rgba(0,0,0,.7);
  animation:zoomIn .35s ease;
}

.login-box h3{
  margin-top:0;
  text-align:center;
}

.login-box input{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:0;
  background:#0b0312;
  color:white;
  margin-top:10px;
}

.login-actions{
  display:flex;
  gap:10px;
  justify-content:flex-end;
  margin-top:18px;
}

@keyframes zoomIn{
  from{transform:scale(.85);opacity:0}
  to{transform:scale(1);opacity:1}
}

@media(max-width:640px){
  .options{flex-direction:column}
}
</style>
</head>

<body>

<div class="top-right">Designed &amp; Developed by Noor Ali</div>

<div class="wrap">
  <div class="box" id="box">
    <h2>Choose how to continue</h2>

    <div class="options">
      <button class="big-btn" id="playerBtn">Player Registration</button>
      <button class="big-btn ghost" id="adminBtn">Admin Page</button>
    </div>
  </div>
</div>

<!-- LOGIN MODAL -->
<div id="loginModal" class="modal hidden">
  <div class="login-box">
    <h3>Admin Login</h3>

    <input id="adminUser" placeholder="Username">
    <input id="adminPass" type="password" placeholder="Password">

    <div class="login-actions">
      <button class="ghost" id="cancelLogin">Cancel</button>
      <button class="big-btn" id="doLogin">Login</button>
    </div>
  </div>
</div>

<svg class="swirl" width="100%" height="100%">
  <defs>
    <linearGradient id="g1" x1="0" x2="1">
      <stop offset="0" stop-color="#ff4b6e"/>
      <stop offset="1" stop-color="#ffd36b"/>
    </linearGradient>
  </defs>
  <circle cx="20%" cy="20%" r="300" fill="url(#g1)"/>
</svg>

<script>
const box = document.getElementById('box');
const playerBtn = document.getElementById('playerBtn');
const adminBtn = document.getElementById('adminBtn');

const loginModal = document.getElementById('loginModal');
const doLogin = document.getElementById('doLogin');
const cancelLogin = document.getElementById('cancelLogin');

const adminUser = document.getElementById('adminUser');
const adminPass = document.getElementById('adminPass');

/* PLAYER FLOW */
playerBtn.onclick = () => {
  box.style.transform = 'rotateY(90deg) translateY(-80px) scale(.8)';
  box.style.opacity = 0;
  setTimeout(()=> location.href='register.html',650);
};

/* ADMIN FLOW → LOGIN FIRST */
adminBtn.onclick = () => {
  loginModal.classList.remove('hidden');
};

/* LOGIN CHECK */
doLogin.onclick = () => {
  if(adminUser.value === 'Ali' && adminPass.value === 'ali@123'){
    loginModal.classList.add('hidden');
    box.style.transform = 'translateY(20px) scale(.97)';
    setTimeout(()=> location.href='admin.html',450);
  }else{
    alert('Invalid Admin Credentials');
  }
};

cancelLogin.onclick = () => {
  loginModal.classList.add('hidden');
};
</script>

</body>
</html>
